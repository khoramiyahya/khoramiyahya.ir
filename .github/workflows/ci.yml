name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PersonalBrandPlatform.sln

      - name: Build
        run: dotnet build PersonalBrandPlatform.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PersonalBrandPlatform.sln --configuration Release --no-build --verbosity normal
